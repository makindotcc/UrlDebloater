name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GTK4 and libadwaita for the configuration window
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - name: Build and test
        run: |
          cargo test -p urldebloater-desktop-config
          cargo build --workspace --locked
          cargo check -p urldebloater-desktop-daemon --no-default-features --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The window itself imports native WinUI 3 types, so only type-checking is
      # meaningful without the Windows App SDK runtime.
      - run: cargo check -p urldebloater-desktop-config-gui --locked
      - run: cargo check -p urldebloater-desktop-daemon --locked
      - run: cargo check -p urldebloater-desktop-daemon --no-default-features --locked

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo check -p urldebloater-desktop-config-gui --locked
      - run: cargo check -p urldebloater-desktop-daemon --locked
      - run: cargo check -p urldebloater-desktop-daemon --no-default-features --locked
