name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            formats: deb,appimage
            artifact: linux
          - os: windows-latest
            formats: nsis
            artifact: windows
          - os: macos-14
            formats: app,dmg
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev patchelf file pkg-config libssl-dev dpkg-dev librsvg2-dev libgirepository1.0-dev

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: cargo packager -p urldebloater-desktop-daemon --release --formats ${{ matrix.formats }}

      - name: Verify macOS ad-hoc signatures
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="dist/UrlDebloater.app"
          codesign --verify --deep --strict --verbose=2 "$app"

          unpacked=$(mktemp -d)
          tar -xzf dist/UrlDebloater.app.tar.gz -C "$unpacked"
          codesign --verify --deep --strict --verbose=2 "$unpacked/UrlDebloater.app"

          dmgs=(dist/*.dmg)
          test "${#dmgs[@]}" -eq 1
          mountpoint=$(mktemp -d)
          trap 'hdiutil detach "$mountpoint" -quiet' EXIT
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -mountpoint "$mountpoint"
          codesign --verify --deep --strict --verbose=2 "$mountpoint/UrlDebloater.app"

      - uses: actions/upload-artifact@v4
        with:
          name: urldebloater-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.1.0'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Set Android version code
        run: echo "ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing required secret $variable"
              exit 1
            fi
          done
          mkdir -p android/.signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/.signing/release.jks
      - name: Build release APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/.signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Verify and stage APK
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          version_name=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$version_name" = "${GITHUB_REF_NAME#v}"
          fi
          cp "$apk" "dist/UrlDebloater_${version_name}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: urldebloater-android
          path: dist/*.apk
          if-no-files-found: error
      - name: Remove Android signing key
        if: always()
        run: rm -rf android/.signing

  release:
    needs: [package, android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify Cargo version matches tag
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$version" = "${GITHUB_REF_NAME#v}"

      - name: Generate update manifest
        shell: bash
        run: |
          python3 scripts/generate-latest-json.py \
            dist "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            dist/latest.json
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.app.tar.gz
            dist/*.dmg
            dist/*.apk
