[package]
name = "urldebloater"
version = "0.1.4"
edition = "2021"
description = "An url debloater."
authors = ["makindotcc"]

[dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = { version = "3.6", default-features = false }
anyhow = "1.0"
urlwasher = { path = "../urlwasher" }
tray-icon = { version = "0.11.3", default-features = false }
image = "0.24"
url = "2.5"
futures = "0.3.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
auto-launch = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
gtk = "0.18"
glib = "0.18"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "2.5.2"

[features]
console = []
