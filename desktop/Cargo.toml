[package]
name = "urldebloater"
version = "0.1.4"
edition = "2021"
description = "An url debloater."
authors = ["makindotcc"]

[dependencies]
log = "0.4"
arboard = { version = "3.6", default-features = false }
anyhow = "1.0"
urlwasher = { path = "../urlwasher" }
ksni = { version = "0.3", default-features = false, features = [
    "async-io",
    "blocking",
], optional = true }
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
auto-launch = "0.5"
tokio = { version = "1.52", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false, features = [
    "wayland-data-control",
] }
fltk = { version = "1.5", default-features = false, features = [
    "no-images",
    "no-pango",
], optional = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "2.5.2"

[features]
default = ["tray"]
console = []
config-gui = ["dep:fltk"]
tray = ["dep:ksni"]
