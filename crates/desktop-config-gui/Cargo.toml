[package]
name = "urldebloater-desktop-config-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
urldebloater-desktop-config.workspace = true
urldebloater-urlwasher.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
url.workspace = true
strum.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
winio = { workspace = true, features = ["qt"] }

[target.'cfg(target_os = "windows")'.dependencies]
winio = { workspace = true, features = ["winui"] }

[target.'cfg(target_os = "macos")'.dependencies]
winio.workspace = true
