[package]
name = "urldebloater-desktop-config-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
urldebloater-desktop-config = { path = "../desktop-config" }
urldebloater-urlwasher = { path = "../urlwasher" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
url = "2.5"
strum = { version = "0.28", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
winio = { version = "0.12", default-features = false, features = ["qt"] }

[target.'cfg(target_os = "windows")'.dependencies]
winio = { version = "0.12", default-features = false, features = ["winui"] }

[target.'cfg(target_os = "macos")'.dependencies]
winio = { version = "0.12", default-features = false }
