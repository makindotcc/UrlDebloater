[package]
name = "urldebloater-urlwasher"
version.workspace = true
edition = "2021"

[dependencies]
url.workspace = true
reqwest = { workspace = true, optional = true }
anyhow.workspace = true
log.workspace = true
lru.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tokio = { workspace = true, optional = true, features = ["fs"] }
uniffi = { version = "0.32.2", optional = true, features = ["tokio"] }
thiserror = { version = "2", optional = true }

[features]
default = ["native"]
native = ["dep:reqwest"]
cleanurls-cache = ["native", "dep:tokio"]
uniffi = ["dep:uniffi", "dep:thiserror", "cleanurls-cache"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
