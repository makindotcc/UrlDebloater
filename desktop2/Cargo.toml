[package]
name = "urldebloater-desktop2"
version = "0.1.0"
edition = "2024"

[dependencies]
urlwasher = { path = "../urlwasher" }
urldebloater-config = { path = "../urldebloater-config" }
log = "0.4"
arboard = { version = "3.6", default-features = false, features = [
    "wayland-data-control",
] }
anyhow = "1.0"
tokio = { version = "1.52", features = ["macros", "rt", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
env_logger = "0.11"
notify = "8.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }
winit = "0.30"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_DataExchange"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
