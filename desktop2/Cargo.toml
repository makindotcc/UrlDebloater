[package]
name = "urldebloater-desktop2"
version = "0.1.0"
edition = "2024"

[dependencies]
urlwasher = { path = "../urlwasher" }
log = "0.4"
arboard = { version = "3.6", default-features = false, features = [
    "wayland-data-control",
] }
anyhow = "1.0"
tokio = { version = "1.52", features = ["macros", "rt", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
env_logger = "0.11"
notify = "8.2"
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
winit = "0.30"
